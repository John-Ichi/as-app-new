name: Push Relay

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/push-relay.mjs
        env:
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
